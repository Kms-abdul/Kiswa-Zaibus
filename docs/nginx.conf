# Nginx for Windows (alternative to IIS) in front of the Kiswa-Zaibus gateway.
# Install Nginx, put this in conf\nginx.conf's http { } block, set your names and certificate paths, then: nginx -s reload
# In backend\.env set GATEWAY_HOST=127.0.0.1, PUBLIC_HTTPS=1, COOKIE_SECURE=1 and restart KZ-Gateway and KZ-API.

server {
    listen 80;
    server_name ops.kiswazaibus.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ops.kiswazaibus.in;
    ssl_certificate     C:/certs/ops.kiswazaibus.in.crt;
    ssl_certificate_key C:/certs/ops.kiswazaibus.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
