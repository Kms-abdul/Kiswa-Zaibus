# /etc/nginx/kz_proxy.conf — shared proxy settings for the API locations in kz.conf
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 65s;
proxy_buffering on;
# Flask already sends Cache-Control: no-store and nosniff on API responses; nginx adds the rest of the security headers.
proxy_hide_header X-Content-Type-Options;
include /etc/nginx/kz_headers.conf;
