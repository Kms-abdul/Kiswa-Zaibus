# /etc/nginx/conf.d/kz.conf — installed by deploy/oci/install.sh (server_name is replaced with your domain).
# Serves the built PWA from /opt/kz-app/frontend/dist and proxies /api and /webhooks to Gunicorn on 127.0.0.1:5000.
# certbot --nginx adds the 443 server block and the http->https redirect.

limit_req_zone $binary_remote_addr zone=kz_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kz_api:10m rate=20r/s;

upstream kz_api { server 127.0.0.1:5000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /opt/kz-app/frontend/dist;
    index index.html;
    client_max_body_size 12m;          # evidence uploads (MAX_UPLOAD_MB=10) + form overhead
    server_tokens off;

    include /etc/nginx/kz_headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    limit_req_status 429;

    # Password / one-time-code endpoints only: slow down guessing (the app also locks accounts). Not /api/auth/me,
    # which every page load calls.
    location ~ ^/api/(auth/(login|otp|forgot|reset|change-password|reauth)|shop/auth/(start|verify))$ {
        limit_req zone=kz_auth burst=10 nodelay;
        proxy_pass http://kz_api;
        include /etc/nginx/kz_proxy.conf;
    }
    location /api/ {
        limit_req zone=kz_api burst=60 nodelay;
        proxy_pass http://kz_api;
        include /etc/nginx/kz_proxy.conf;
    }
    location /webhooks/ {
        proxy_pass http://kz_api;
        include /etc/nginx/kz_proxy.conf;
    }

    # PWA: the service worker and manifest must never be cached, or phones keep an old version.
    location = /sw.js                 { include /etc/nginx/kz_headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /manifest.webmanifest  { include /etc/nginx/kz_headers.conf; add_header Cache-Control "no-cache" always; default_type application/manifest+json; try_files $uri =404; }
    location = /index.html            { include /etc/nginx/kz_headers.conf; add_header Cache-Control "no-cache" always; }
    # Hashed build files never change: cache for a year.
    location /assets/ { include /etc/nginx/kz_headers.conf; add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    # Client-side routes (/pos, /shop, /approvals/...) fall back to the app shell.
    location / { try_files $uri $uri/ /index.html; }
}
